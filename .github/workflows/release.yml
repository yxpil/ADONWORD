name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          DIR="adonword-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/adonword" "$DIR/"
          cp README.md LICENSE "$DIR/"
          tar czf "adonword-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "$DIR"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $dir = "adonword-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/adonword.exe" $dir
          Copy-Item README.md $dir
          Copy-Item LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "adonword-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            adonword-*.tar.gz
            adonword-*.zip
